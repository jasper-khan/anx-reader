name: Setup Environment

on:
  workflow_call:
    outputs:
      tag:
        description: "Git tag"
        value: ${{ jobs.setup.outputs.tag }}
      version:
        description: "Version string"
        value: ${{ jobs.setup.outputs.version }}
      release_notes:
        description: "Release notes"
        value: ${{ jobs.setup.outputs.release_notes }}
      flutter_version:
        description: "Flutter SDK version"
        value: ${{ jobs.setup.outputs.flutter_version }}

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.get_version.outputs.tag }}
      version: ${{ steps.get_version.outputs.version }}
      release_notes: ${{ steps.extract_release_notes.outputs.release_notes }}
      flutter_version: ${{ steps.get_flutter_version.outputs.flutter_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Flutter version
        id: get_flutter_version
        run: |
          FLUTTER_VERSION=$(cat .github/flutter-version)
          echo "flutter_version=${FLUTTER_VERSION}" >> $GITHUB_OUTPUT

      - name: Validate stable release version
        id: get_version
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

          PUBSPEC_VERSION=$( grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f 1 )

          if [[ "$TAG" =~ ^v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$ ]]; then
            BASE_VERSION="${BASH_REMATCH[1]}"
            echo "version=${BASE_VERSION}" >> $GITHUB_OUTPUT
          else
            echo "::error::Use a stable version tag such as v1.15.1: ${TAG}" >&2
            exit 1
          fi

          if [[ "${BASE_VERSION}" != "${PUBSPEC_VERSION}" ]]; then
            echo "::error::Tag version ${BASE_VERSION} does not match pubspec version ${PUBSPEC_VERSION}" >&2
            exit 1
          fi

      - name: Extract release notes
        id: extract_release_notes
        run: |
          CHANGELOG_CONTENT=$(awk -v heading="## $VERSION" '
            /^## / { if (found) exit; if ($0 == heading) found = 1 }
            found { print }
          ' assets/CHANGELOG.md)
          echo "release_notes<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG_CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
