name: Build Windows

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      flutter_version:
        required: true
        type: string

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ inputs.flutter_version }}

      - name: Get Dependencies
        run: |
          flutter --version
          flutter pub get

      - name: Prepare for Windows
        shell: bash
        run: |
          flutter config --enable-windows-desktop
          sed -i "1i #define MyAppVersion \"${{ inputs.version }}\"" scripts/compile_windows_setup-inno.iss

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
        shell: pwsh

      - name: Build for Windows
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Stage unsigned zip for installer
        shell: bash
        run: cp build/windows/unsigned/app.zip build/windows/app.zip

      - name: Build Windows installer exe
        shell: pwsh
        run: ./scripts/build_windows_exe.ps1

      - name: Rename builds
        shell: bash
        run: |
          cd build
          mv windows/unsigned/app.zip windows/Anx-Reader-windows-${{ inputs.version }}.zip
          mv windows/unsigned/app.exe windows/Anx-Reader-windows-${{ inputs.version }}.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            build/windows/*.zip
            build/windows/*.exe
          if-no-files-found: error